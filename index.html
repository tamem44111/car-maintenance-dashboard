<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <title>AutoCare</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="next/next.css">
</head>
<body>
    <main id="app"></main>
    <div id="sheet"></div>
    <div id="viewer"></div>
    <div id="toast" role="status" aria-live="polite"></div>

    <!-- The same logic the classic screens (classic.html) run, so both always show the same numbers. -->
    <script src="i18n.js"></script>
    <script src="photos.js"></script>
    <script src="storage.js"></script>
    <script src="recommendations.js"></script>
    <script src="features.js"></script>
    <script src="next/next.js"></script>
    <script src="next/forms.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
        // updateViaCache:'none' stops the browser HTTP-caching sw.js itself, so a new
        // deploy is always detected; update() forces a check on every load.
        // Only an *existing* controller being replaced means a new deploy took over;
        // on a first install there is nothing stale on screen, so no reload is needed.
        var hadController = !!navigator.serviceWorker.controller;
        var reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (!hadController || reloaded) return;
            reloaded = true;
            // A new version can take over moments after opening. Reloading then would
            // throw away whatever is being typed, so wait for the sheet to close.
            if (document.getElementById('sheet').classList.contains('open')) window.__reloadAfterSheet = true;
            else location.reload();
        });
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
            .then(function (reg) { reg.update(); })
            .catch(function () {});
    }
    </script>
</body>
</html>
