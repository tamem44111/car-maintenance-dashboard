<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Maintenance Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">&#9881;</span>
                    <h1>AutoCare</h1>
                </div>
            </div>
            <ul class="nav-links">
                <li>
                    <a href="#" class="nav-link active" data-page="dashboard">
                        <span class="nav-icon">&#9632;</span>
                        Dashboard
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link" data-page="cars">
                        <span class="nav-icon">&#128663;</span>
                        My Cars
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link" data-page="services">
                        <span class="nav-icon">&#128295;</span>
                        Services
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link" data-page="expenses">
                        <span class="nav-icon">&#128176;</span>
                        Expenses
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link" data-page="reminders">
                        <span class="nav-icon">&#128276;</span>
                        Reminders
                    </a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <select id="car-selector" class="car-select">
                    <option value="all">All Cars</option>
                </select>
            </div>
        </nav>

        <main class="content">
            <header class="content-header">
                <h2 id="page-title">Dashboard</h2>
                <div class="header-actions">
                    <button id="add-btn" class="btn btn-primary" style="display:none;">+ Add New</button>
                </div>
            </header>

            <div id="page-content" class="page-content">
                <!-- Dashboard Page -->
                <div id="page-dashboard" class="page active">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-icon blue">&#128663;</div>
                            <div class="stat-info">
                                <span class="stat-value" id="stat-cars">0</span>
                                <span class="stat-label">Cars</span>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon green">&#128295;</div>
                            <div class="stat-info">
                                <span class="stat-value" id="stat-services">0</span>
                                <span class="stat-label">Services</span>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon orange">&#128176;</div>
                            <div class="stat-info">
                                <span class="stat-value" id="stat-expenses">0 SAR</span>
                                <span class="stat-label">Total Spent</span>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon red">&#128276;</div>
                            <div class="stat-info">
                                <span class="stat-value" id="stat-reminders">0</span>
                                <span class="stat-label">Upcoming</span>
                            </div>
                        </div>
                    </div>
                    <div class="dashboard-grid">
                        <div class="card">
                            <h3>Recent Services</h3>
                            <div id="recent-services" class="card-body">
                                <p class="empty-state">No services recorded yet</p>
                            </div>
                        </div>
                        <div class="card">
                            <h3>Upcoming Reminders</h3>
                            <div id="upcoming-reminders" class="card-body">
                                <p class="empty-state">No upcoming reminders</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Cars Page -->
                <div id="page-cars" class="page">
                    <div id="cars-list" class="cards-grid"></div>
                </div>

                <!-- Services Page -->
                <div id="page-services" class="page">
                    <div id="services-list" class="table-container"></div>
                </div>

                <!-- Expenses Page -->
                <div id="page-expenses" class="page">
                    <div id="expenses-summary" class="stats-grid"></div>
                    <div id="expenses-list" class="table-container"></div>
                </div>

                <!-- Reminders Page -->
                <div id="page-reminders" class="page">
                    <div id="reminders-list" class="cards-grid"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Add New</h3>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div id="modal-body" class="modal-body"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
                <button class="btn btn-primary" id="modal-save">Save</button>
            </div>
        </div>
    </div>

    <script src="storage.js"></script>
    <script src="recommendations.js"></script>
    <script src="app.js"></script>
</body>
</html>
